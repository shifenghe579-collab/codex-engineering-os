id: T001
kind: governance
contract_version: 1
status: DESIGNING

goal: Close the two known merge-governance gaps before the repository is used for product development.
current_behavior: Pull-request checks validate the changed Task Contract but do not explicitly require MERGE_READY, and GitHub Environments still permit administrator bypass without a documented manual hardening step.
expected_behavior: Every substantive pull request is rejected unless its single changed Task Contract is MERGE_READY, and repository setup clearly requires the owner to disable administrator bypass in all approval environments through GitHub settings.
non_goals:
  - Automate a GitHub Environment setting that is not exposed by the available REST API.
  - Change the single-owner reviewer or prevent_self_review policy.
  - Redesign the task state machine or risk model.
invariants:
  - Pull requests must still change exactly one formal Task Contract.
  - Existing schema, scope, transition, evidence, and risk checks remain mandatory.
  - Local validation without a base ref remains usable for repository-wide checks.
acceptance_criteria:
  - A substantive pull request whose changed Task Contract is READY or any other non-MERGE_READY state fails CI with a clear error.
  - A valid substantive pull request whose changed Task Contract is MERGE_READY passes the new state gate.
  - Automated tests cover both rejection and acceptance behavior at the CI entry-point boundary.
  - GitHub setup documentation names all three environments and the exact manual administrator-bypass hardening action.
  - The complete engineering verification suite and GitHub required checks pass on the integration candidate.
open_questions: []

scope:
  allowed:
    - docs/engineering/tasks/T001.yaml
    - docs/engineering/evidence/T001/**
    - scripts/engineering/ci_check.py
    - scripts/engineering/tests/test_os_core.py
    - docs/engineering/GITHUB_SETUP.md
    - docs/engineering/HANDOFF.md
  forbidden:
