risk:
  classified: R2
  floor: R2
  triggers:
    - major_infrastructure

technical_direction: Add one explicit PR-only MERGE_READY assertion in ci_check.py, exercise it through main() with temporary repositories, and document the UI-only Environment setting without weakening any existing gate.
execution_plan:
  - Obtain an independent architecture challenge on the minimal design.
  - Dispatch the approved contract to Worker for a surgical implementation and tests.
  - Bind implementation evidence to the implementation commit.
  - Obtain independent Reviewer and Verifier evidence on the same commit.
  - Build one integration candidate, rerun all required checks, and request user-controlled GitHub approvals.

