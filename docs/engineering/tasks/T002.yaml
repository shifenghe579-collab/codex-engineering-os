change_impact:
  spec: false
  architecture: true
  project: false
  adr: false
  tests: true
  runtime: false

risk:
  classified: R2
  floor: R2
  triggers:
    - major_infrastructure

technical_direction: Add pull-request freshness validation at the ci_check.py entry-point boundary. For final status MERGE_READY, resolve the changed Task and Evidence from the explicit head ref; require git.base_sha to identify the explicit PR base; require that base to be an ancestor of implementation_sha, integration_candidate_sha, and every valid Evidence subject, and each subject to be an ancestor of the explicit head. Directly compare subject to head and permit only same-task recording paths. At every subject, require the same Task and frozen authorization snapshot, then enforce monotonic recording fields. For MERGED and later lifecycle-only transitions, skip pre-squash ancestry and instead compare base and head to freeze candidate, inherited approvals, existing Evidence refs/manifests, and all non-lifecycle fields. Keep non-PR validation behavior unchanged and fail clearly when required Git objects are unavailable.
execution_plan:
  - Obtain an independent architecture challenge on ancestor, bookkeeping, and contract-semantic rules.
  - Dispatch the approved contract to an isolated Worker implementation.
  - Add focused temporary-repository tests at the CI entry-point boundary.
  - Bind implementation Evidence to the implementation SHA.
  - Obtain independent Reviewer and Verifier evidence on the same SHA.
  - Build one integration candidate, rerun required verification, and merge only after all required gates pass.

